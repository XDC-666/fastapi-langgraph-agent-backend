<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent 聊天</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6f8; color: #1f2329; }
    header { background: #1f2329; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 16px; margin: 0; }
    .container { max-width: 880px; margin: 0 auto; padding: 16px; }
    .panel { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button, textarea { font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid #d0d3d9; }
    input, textarea { flex: 1; }
    button { background: #2b6cff; color: #fff; border: none; cursor: pointer; }
    button:disabled { background: #aab; cursor: not-allowed; }
    .messages { min-height: 320px; max-height: 60vh; overflow-y: auto; }
    .msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
    .msg.user { background: #e8f0ff; text-align: right; }
    .msg.assistant { background: #f0f1f3; }
    .hint { color: #8a90a0; font-size: 12px; margin: 4px 0; }
    .token-box { display: flex; gap: 8px; align-items: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Agent 聊天（FastAPI + LangGraph）</h1>
    <button id="logoutBtn" class="hidden">退出</button>
  </header>

  <div class="container">
    <!-- 登录面板 -->
    <div class="panel" id="loginPanel">
      <h3>登录 / 注册</h3>
      <div class="row">
        <input id="username" placeholder="用户名" />
        <input id="email" placeholder="邮箱（注册时填）" />
        <input id="password" type="password" placeholder="密码" />
      </div>
      <div class="row" style="margin-top:8px;">
        <button id="loginBtn">登录</button>
        <button id="registerBtn">注册</button>
        <span class="hint" id="authHint">登录用 username + password；注册需填 email</span>
      </div>
    </div>

    <!-- 聊天面板 -->
    <div class="panel hidden" id="chatPanel">
      <div class="row">
        <button id="newChatBtn">+ 新会话</button>
        <select id="convSelect"><option value="">选择会话…</option></select>
        <label class="hint"><input type="checkbox" id="useKb" /> 使用知识库</label>
      </div>
      <div class="messages" id="messages"></div>
      <div class="row" style="margin-top:8px;">
        <textarea id="input" rows="2" placeholder="输入消息，回车发送（Shift+Enter 换行）"></textarea>
        <button id="sendBtn">发送</button>
      </div>
      <div class="hint">提示：先到「知识库」上传文档，再勾选「使用知识库」进行问答。</div>
    </div>

    <!-- 知识库面板 -->
    <div class="panel hidden" id="kbPanel">
      <h3>知识库（RAG）</h3>
      <div class="row">
        <input type="file" id="kbFile" />
        <button id="uploadBtn">上传文档</button>
        <span class="hint" id="kbHint">支持 txt / md / pdf / docx</span>
      </div>
    </div>
  </div>

  <script>
    const API = "/api/v1";
    const $ = (id) => document.getElementById(id);

    function getToken() { return localStorage.getItem("token"); }
    function setToken(t) { localStorage.setItem("token", t); }
    function clearToken() { localStorage.removeItem("token"); }

    function authHeaders() { return { Authorization: "Bearer " + getToken() }; }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: { ...(opts.headers || {}), ...authHeaders() },
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || res.statusText);
      }
      return res;
    }

    // 登录
    $("loginBtn").onclick = async () => {
      const body = new URLSearchParams();
      body.set("username", $("username").value);
      body.set("password", $("password").value);
      try {
        const res = await fetch(API + "/auth/login", {
          method: "POST",
          body,
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
        });
        if (!res.ok) throw new Error("登录失败，检查用户名/密码");
        const data = await res.json();
        setToken(data.access_token);
        enterApp();
      } catch (e) { $("authHint").textContent = e.message; }
    };

    // 注册
    $("registerBtn").onclick = async () => {
      try {
        await api("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("username").value, email: $("email").value, password: $("password").value }),
        });
        $("authHint").textContent = "注册成功，请点击登录";
      } catch (e) { $("authHint").textContent = e.message; }
    };

    function enterApp() {
      $("loginPanel").classList.add("hidden");
      $("chatPanel").classList.remove("hidden");
      $("kbPanel").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
      loadConversations();
    }

    function logout() {
      clearToken();
      location.reload();
    }
    $("logoutBtn").onclick = logout;

    // 会话列表
    async function loadConversations() {
      try {
        const res = await api("/conversations");
        const list = await res.json();
        const sel = $("convSelect");
        sel.innerHTML = '<option value="">选择会话…</option>';
        list.forEach((c) => {
          const o = document.createElement("option");
          o.value = c.id; o.textContent = `#${c.id} ${c.title}`;
          sel.appendChild(o);
        });
      } catch (e) { console.error(e); }
    }

    $("newChatBtn").onclick = () => { $("convSelect").value = ""; $("messages").innerHTML = ""; };

    // 发送（流式）
    $("sendBtn").onclick = sendMessage;
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    async function sendMessage() {
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      addMsg("user", text);
      const placeholder = addMsg("assistant", "…");

      try {
        const res = await api("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            conversation_id: $("convSelect").value ? Number($("convSelect").value) : null,
            use_knowledge: $("useKb").checked,
          }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let full = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          chunk.split("\n").forEach((line) => {
            if (line.startsWith("data: ")) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.delta) { full += data.delta; placeholder.textContent = full; }
                if (data.done) { $("convSelect").value = String(data.conversation_id); loadConversations(); }
              } catch (e) {}
            }
          });
        }
      } catch (e) {
        placeholder.textContent = "错误：" + e.message;
      }
    }

    function addMsg(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = content;
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return div;
    }

    // 知识库上传
    $("uploadBtn").onclick = async () => {
      const file = $("kbFile").files[0];
      if (!file) { $("kbHint").textContent = "请先选择文件"; return; }
      const form = new FormData();
      form.append("file", file);
      try {
        const res = await fetch(API + "/knowledge/upload", {
          method: "POST", body: form, headers: authHeaders(),
        });
        const data = await res.json();
        $("kbHint").textContent = `已上传：${data.filename}，切分 ${data.chunks} 块`;
      } catch (e) { $("kbHint").textContent = "上传失败：" + e.message; }
    };

    // 已登录则直接进入
    if (getToken()) { enterApp(); }
  </script>
</body>
</html>
