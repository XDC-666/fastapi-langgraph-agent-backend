# 一键启动：PostgreSQL + Redis + 后端服务
# 用法：
#   cp .env.example .env   # 填入 OPENAI_API_KEY 等
#   docker compose up --build
#
# 安全说明：本文件面向**本机开发**，所有端口仅绑定 127.0.0.1。
# 部署到服务器前必须：① 改掉下面的 postgres/postgres 默认弱口令；
# ② 保持回环绑定，由 Nginx / 负载均衡反向代理对外；③ 不要直接暴露 5432 / 6379。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    ports:
      # 仅绑定回环地址：默认不把数据库暴露到宿主机所有网卡。
      # 确需局域网访问时，再显式改为绑定全部网卡（把主机段写成通配地址）。
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      # Redis 默认无密码，绝不能暴露到公网；仅回环可达。
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      # 生产部署请置于 Nginx / 负载均衡之后，不要把 API 直接暴露到公网。
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/agentdb
      REDIS_URL: redis://redis:6379/0
      # 生产环境关闭自动建表，改用 Alembic 迁移（下方 command 启动前执行）
      AUTO_CREATE_TABLES: "false"
      # 安全相关：务必在 .env 中设置强随机 SECRET_KEY，否则 JWT 可被伪造
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      REQUIRE_SECRET_KEY: ${REQUIRE_SECRET_KEY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      # 可选：开启 Agent 记忆持久化（需 langgraph-checkpoint-sqlite）
      # CHECKPOINTER_URI: sqlite:////app/data/checkpoints.sqlite
    # 先用 Alembic 把表结构迁移到最新，再启动服务
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
