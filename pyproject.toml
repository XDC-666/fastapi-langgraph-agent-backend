[project]
name = "fastapi-langgraph-agent-backend"
version = "0.1.0"
description = "基于 FastAPI + LangGraph 的 AI Agent 后端服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "bcrypt>=4.1.0,<6.0.0",
    "redis>=5.1.0,<9.0.0",
    "langchain>=0.3.0,<2.0.0",
    "langchain-core>=0.3.0,<2.0.0",
    "langchain-openai>=0.2.0,<2.0.0",
    "langchain-chroma>=0.2.0,<2.0.0",
    "langchain-text-splitters>=0.3.0,<2.0.0",
    "langgraph>=0.2.0,<2.0.0",
    "chromadb>=0.5.0,<2.0.0",
    "pypdf>=4.3.0,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "typing-extensions>=4.12.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
# 让 async def 测试自动被识别，无需逐个打 @pytest.mark.asyncio
asyncio_mode = "auto"
# 保证无论用 `pytest` 还是 `python -m pytest`，都能 import 到 app 包
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# ORM 关系用字符串前向引用（如 Mapped["User"]），静态分析识别不到，属误报
"app/models/*.py" = ["F821"]
